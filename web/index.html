<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plonk</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1b1f; color: #ddd; font: 14px system-ui, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  #bar { flex: none; padding: 6px 12px; display: flex; gap: 12px; align-items: center; }
  select, button { font: inherit; }
  #stage { position: relative; flex: 1; min-height: 0; overflow: hidden; background: #3a6ea5; }
  #screen { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  #desktop { position: absolute; left: 14px; top: 14px; display: flex; flex-direction: column; flex-wrap: wrap; gap: 10px; max-height: calc(100% - 28px); align-content: flex-start; }
  .icon { width: 86px; padding: 6px 4px; border-radius: 10px; text-align: center; color: #fff; font-size: 12px; text-shadow: 0 1px 3px rgba(0,0,0,.75); cursor: default; user-select: none; }
  .icon svg { display: block; margin: 0 auto 4px; filter: drop-shadow(0 3px 6px rgba(0,0,0,.35)); }
  .icon:hover { background: rgba(255,255,255,.16); }
  .icon.sel { background: rgba(255,255,255,.28); box-shadow: inset 0 0 0 1px rgba(255,255,255,.45); }
  .icon span { display: block; overflow-wrap: anywhere; }
  #explorer { position: absolute; left: 140px; top: 40px; width: 460px; height: 340px; display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; color: #1a1a1a; background: rgba(244,246,250,.92); backdrop-filter: blur(18px); box-shadow: 0 14px 40px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.6); font-size: 13px; }
  #explorer[hidden] { display: none; }
  #explorer .exp-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: linear-gradient(#c9bdf5,#b3a5ee); font-weight: 600; }
  #explorer .exp-path { flex: 1; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #explorer .exp-close { border: 0; background: #e05a6f; color: #fff; border-radius: 6px; width: 24px; height: 20px; cursor: pointer; }
  #explorer .exp-list { flex: 1; overflow: auto; padding: 4px; }
  .exp-row { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; padding: 3px 8px; border-radius: 6px; cursor: default; user-select: none; }
  .exp-row:hover { background: rgba(100,80,200,.10); }
  .exp-row.sel { background: rgba(100,80,200,.22); }
  .exp-row i { color: #666; font-style: normal; font-size: 12px; }
  #status { flex: none; display: flex; gap: 16px; padding: 4px 12px; border-top: 1px solid #2c2c33; min-height: 20px; align-items: center; }
  #log { flex: 1; color: #9a9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #out { max-width: 40%; margin: 0; color: #bbb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div id="bar">
  <strong>Plonk</strong>
  <label>App <select id="app"></select></label>
  <button id="run">Run</button>
  <button id="exp">Explorer</button>
  <label>or your own 32-bit .exe <input type="file" id="file" accept=".exe"></label>
</div>
<div id="stage"><canvas id="screen" width="1024" height="768"></canvas><div id="desktop"></div><div id="explorer" hidden><div class="exp-head"><span>Explorer</span><span class="exp-path"></span><button class="exp-close" title="Close">×</button></div><div class="exp-list"></div></div><canvas id="glov" style="position:absolute;display:none;pointer-events:none;margin:0"></canvas></div>
<div id="status"><div id="log">loading…</div><pre id="out"></pre></div>
<script type="module">
let W = 1024, H = 768; // the guest screen = the stage area (viewport minus the top bar and the status bar); follows window resizes
const stageEl = document.getElementById("stage");
{ const r = stageEl.getBoundingClientRect(); W = Math.max(320, Math.floor(r.width)); H = Math.max(240, Math.floor(r.height)); const c = document.getElementById("screen"); c.width = W; c.height = H; }
const log = (s) => (document.getElementById("log").textContent = s);
const canvas = document.getElementById("screen"), ctx = canvas.getContext("2d");
const enc = new TextEncoder();
let x, wasm, gpuc = null;
// GPU compositor: created lazily (its shader compile blocks the main thread), after the first paint or when Run is pressed
let gpucP = null;
function ensureGpuc() {
  if (gpucP || new URLSearchParams(location.search).has("cpu")) return gpucP ?? Promise.resolve();
  return (gpucP = import("./compositor_gpu.mjs").then((m) => {
    const tg = performance.now();
    gpuc = m.createGpuCompositor(W, H);
    console.info(`[timing] GPU compositor ${gpuc ? "ready" : "unavailable"} in ${Math.round(performance.now() - tg)} ms (shader compile)`);
    window.__gpuc = !!gpuc; if (gpuc && wall) gpuc.setWallpaper(wall); lastGen = -1;
  }).catch((e) => console.info("GPU compositor unavailable, using CPU", e)));
}
// ---- desktop wallpaper ----
let wall = null;
function applyWallpaper() { // CPU compositor path: hand the image to the host
  if (!wall || !x || gpuc) return;
  const c = new OffscreenCanvas(wall.width, wall.height), g = c.getContext("2d");
  g.drawImage(wall, 0, 0);
  x.plonk_wine_set_wallpaper(put(new Uint8Array(g.getImageData(0, 0, wall.width, wall.height).data.buffer)), wall.width, wall.height);
}
function setWall(bmp) { wall = bmp; if (gpuc) gpuc.setWallpaper(bmp); applyWallpaper(); lastGen = -1; ctx.drawImage(bmp, 0, 0, canvas.width, canvas.height); }
const idle = (f) => (window.requestIdleCallback ?? setTimeout)(f);
// Default wallpaper: the wine-glass scene rasterized from vector at the screen size (any size/aspect works).
async function loadWallpaper() {
  try { const m = await import("./wallpaper.mjs"); setWall(await m.rasterize(W, H)); window.__wall = true; } catch (e) { console.info("wallpaper failed", e); }
  idle(() => ensureGpuc());
}
const put = (b) => { const p = x.plonk_alloc(b.length) >>> 0; new Uint8Array(x.memory.buffer, p, b.length).set(b); return p; };

import { peImports } from "/web/pe_imports.mjs";
const T = (window.plonkT = []); const mark = (n) => T.push(n + "=" + Math.round(performance.now()));
async function loadAppList() {
  const manifest = await (await fetch("/manifest.json")).json();
  const sel = document.getElementById("app");
  for (const a of [...manifest.apps].sort((p, q) => (q === "gui_stay.exe") - (p === "gui_stay.exe"))) sel.add(new Option(a));
  log("Pick an app and press Run.");
}
// ---- session disk: files a program installed/created stay available to later runs (not across page loads) ----
import { createShell } from "./shell.mjs";
const disk = { files: new Map(), dirs: new Set() };
let exitedHandled = true;
function readList() {
  if (!x) return [];
  const p = x.plonk_vfs_list() >>> 0, n = x.plonk_vfs_list_len();
  const t = new TextDecoder().decode(new Uint8Array(x.memory.buffer, p, n));
  return t ? t.split("\n").map((l) => { const i = l.lastIndexOf("\t"); return { path: l.slice(0, i), size: Number(l.slice(i + 1)) }; }) : [];
}
function snapshotDisk() { // copy the live VFS's user files out of the running instance (it is about to be replaced)
  if (!x) return;
  const list = readList();
  disk.files.clear(); disk.dirs.clear();
  for (const e of list) {
    if (e.size < 0) { disk.dirs.add(e.path); continue; }
    const n = enc.encode(e.path), p = x.plonk_vfs_get(put(n), n.length) >>> 0;
    if (p) disk.files.set(e.path, new Uint8Array(x.memory.buffer, p, e.size).slice());
  }
}
const shell = createShell({
  desktop: document.getElementById("desktop"), explorer: document.getElementById("explorer"),
  host: {
    list: () => (x ? readList() : [...disk.dirs].map((path) => ({ path, size: -1 })).concat([...disk.files].map(([path, d]) => ({ path, size: d.length })))),
    launch: (path) => boot(null, path),
    isRunning: () => !!x && !exitedHandled,
  },
});
document.getElementById("exp").onclick = () => shell.toggleExplorer();
window.plonkShell = { list: () => readList(), launch: (p) => boot(null, p), imports: (p) => { snapshotDisk(); return peImports(disk.files.get(p)); } }; // test/automation hook
setInterval(() => shell.refresh(), 1500);

async function boot(app, installedPath) {
  mark("start");
  snapshotDisk();
  await ensureGpuc();
  const sel = document.getElementById("app");
  app = app ?? sel.value;
  wasm = await WebAssembly.instantiateStreaming(fetch("/target/wasm32-unknown-unknown/release/plonk_host.wasm"), {});
  x = wasm.instance.exports;
  window.plonk = { x, trace: () => { const p = x.plonk_wine_trace_ptr() >>> 0; return new TextDecoder().decode(new Uint8Array(x.memory.buffer, p, x.plonk_wine_trace_len())); } };
  const add = (name, b) => {
    const n = enc.encode(name);
    x.plonk_wine_add_file(put(n), n.length, put(b), b.length);
  };
  x.plonk_wine_reset();
  document.getElementById("glov").style.display = "none";
  x.plonk_wine_set_screen(W, H);
  for (const d of disk.dirs) { const n = enc.encode(d); x.plonk_vfs_mkdir(put(n), n.length); }
  for (const [p, b] of disk.files) add(p, b);
  exitedHandled = false;
  applyWallpaper();
  lastGen = -1;
  log("downloading Wine runtime (compressed, cached)...");
  const [pack, exe] = await Promise.all([
    fetch("/pack").then((r) => r.arrayBuffer()),
    installedPath ? Promise.resolve(disk.files.get(installedPath).slice().buffer) : customExe ? customExe.arrayBuffer() : fetch(`/tests/guests/${app}`).then((r) => r.arrayBuffer()),
  ]);
  mark("downloaded"); log("loading...");
  const dv = new DataView(pack), u8 = new Uint8Array(pack);
  for (let o = 0; o < pack.byteLength;) {
    const nl = dv.getUint32(o, true); o += 4;
    const name = new TextDecoder().decode(u8.subarray(o, o + nl)); o += nl;
    const dl = dv.getUint32(o, true); o += 4;
    add(name, u8.subarray(o, o + dl)); o += dl;
  }
  if (!installedPath) add("c:\\app.exe", new Uint8Array(exe));
  // prefetch the app's DLL dependency closure so nothing has to be fetched in the middle of a window procedure
  const man = await (await fetch("/manifest.json")).json(), deps = await (await fetch("/deps.json")).json();
  const have = new Set(man.core), want = [], seen = new Set();
  const queue = peImports(new Uint8Array(exe));
  while (queue.length) {
    const n = queue.pop();
    if (seen.has(n)) continue;
    seen.add(n);
    if (!have.has(n) && man.remote.includes(n)) want.push(n);
    for (const d of deps[n] ?? []) queue.push(d);
  }
  if (want.length) log("downloading " + want.join(", ") + "...");
  await Promise.all(want.map(async (n) => add("c:\\windows\\system32\\" + n, new Uint8Array(await (await fetch("/file/" + n)).arrayBuffer()))));
  for (const r of (await (await fetch("/manifest.json")).json()).remote) { const n = enc.encode(r); x.plonk_wine_add_remote(put(n), n.length); }
  const path = enc.encode(installedPath ?? "c:\\app.exe");
  if (x.plonk_wine_boot(put(path), path.length) !== 0) return log("boot failed: " + msg());
  mark("booted"); step(); mark("first-run+draw"); console.info("[timing] " + T.join(" "));
  document.title = "T " + T.join(" ");
}
const msg = () => new TextDecoder().decode(new Uint8Array(x.memory.buffer, x.plonk_wine_msg_ptr() >>> 0, x.plonk_wine_msg_len()));

let lastT = performance.now(), presStep = -9;
let lastGen = -1, lastLog = "";
let stepTimer = 0;
// zero-delay re-entry (setTimeout is clamped to >= 4 ms once nested): a MessageChannel hop yields to input/paint but nothing more
const mc = new MessageChannel();
let soonPending = false;
mc.port1.onmessage = () => { soonPending = false; step(); };
function soon() { if (!soonPending) { soonPending = true; mc.port2.postMessage(0); } }
let fetching = false;
async function supplyFile(key) { // lazy download: the guest asked for a file we did not ship up front
  fetching = true;
  lastLog = ""; // force the status line to refresh once the download is done
  log("downloading " + key.split("\\").pop() + "...");
  try {
    const b = new Uint8Array(await (await fetch("/file/" + key.split("\\").pop())).arrayBuffer());
    const n = enc.encode(key);
    x.plonk_wine_add_file(put(n), n.length, put(b), b.length);
  } finally { fetching = false; }
  step();
}
// ---- 3D: the host emits a canonical GL command stream (docs/GL_PROTOCOL.md); the backend replays it on WebGPU/WebGL2 ----
let glb = null, glInit = null;
function ensureGL() {
  if (glInit) return;
  const prefer = new URLSearchParams(location.search).get("gl") || "webgpu";
  const tgl = performance.now();
  glInit = import("./gl_backend.mjs").then((m) => m.createGLBackend({ prefer, direct: !new URLSearchParams(location.search).has("nodirect") })).then((b) => {
    b.onPresent = (w, h, rgba) => { // a finished frame: copy it into the guest window
      const p = x.plonk_gl_frame_buf(w, h) >>> 0;
      new Uint8Array(x.memory.buffer, p, w * h * 4).set(rgba);
      x.plonk_gl_frame_commit(w, h);
      soon();
    };
    // direct present: the finished frame goes straight to an overlay canvas over the guest window (no readback, no CPU copies)
    const ov = document.getElementById("glov"), ovctx = ov.getContext("bitmaprenderer");
    b.onFrame = (w, h, bmp) => {
      if (ov.width !== w || ov.height !== h) { ov.width = w; ov.height = h; }
      ovctx.transferFromImageBitmap(bmp);
      window.__glDirect = (window.__glDirect || 0) + 1;
    };
    console.info(`[timing] 3D backend ${b.kind} ready in ${Math.round(performance.now() - tgl)} ms`);
    glb = b; window.__glKind = b.kind;
  }).catch((e) => { console.error("3D backend failed", e); glInit = null; x.plonk_gl_clear(); });
}
// The overlay canvas shows the GL frame directly only while the GL window exists, is topmost and unobscured; every step re-checks
// (so it disappears when the app exits, its window is destroyed or something is stacked over it).
function syncOverlay() {
  const ov = document.getElementById("glov");
  if (!glb || !x) { ov.style.display = "none"; return false; }
  const r = new Uint32Array(x.memory.buffer, x.plonk_gl_rect() >>> 0, 5), k = canvas.getBoundingClientRect().width / W;
  glb.direct = r[4] === 1 && r[2] > 0;
  ov.style.display = glb.direct ? "block" : "none";
  if (glb.direct) { ov.style.left = r[0] * k + "px"; ov.style.top = r[1] * k + "px"; ov.style.width = r[2] * k + "px"; ov.style.height = r[3] * k + "px"; }
  return glb.direct;
}
function pumpGL() {
  const n = x.plonk_gl_len();
  if (!n) return;
  if (!glb) { ensureGL(); return; } // commands stay queued in the host until the backend is ready
  syncOverlay();
  const cmds = new Uint32Array(x.memory.buffer, x.plonk_gl_ptr() >>> 0, n).slice();
  x.plonk_gl_clear();
  glb.execute(cmds);
}
function step() {
  if (fetching) return;
  { const t = performance.now(), dt = Math.round(t - lastT); if (dt >= 1) { x.plonk_wine_tick(Math.min(200, dt)); lastT = t; } } // guest clock follows real time every step
  const P = window.__perf ||= { run: 0, gl: 0, comp: 0, n: 0 };
  let t0 = performance.now();
  const pr0 = x.plonk_gl_presents();
  const st = x.plonk_wine_run();
  if (st === 1 && !exitedHandled) { exitedHandled = true; snapshotDisk(); shell.refresh(); } // the program ended: its installed files stay on the session disk
  let t1 = performance.now(); P.run += t1 - t0;
  (P.st ||= {})[st] = (P.st[st] || 0) + 1; P.pres = x.plonk_gl_presents();
  pumpGL();
  syncOverlay();
  let t2 = performance.now(); P.gl += t2 - t1; P.n++;
  if (st === 3) { supplyFile(msg()); return; }
  if (x.plonk_gl_presents() !== pr0) presStep = P.n;
  if (st === 2 || (st === 0 && P.n - presStep <= 2)) soon(); // busy, or a polling render loop that just presented: go again immediately // busy: yield to the page, then continue
  const g = x.plonk_wine_gen();
  if (g !== lastGen) { // redraw only when something on screen changed
    lastGen = g;
    const tc = performance.now();
    if (gpuc) { // GPU compositor: the host only exposes the layers; the page draws wallpaper, shadows, glass blur and windows
      const t = new Uint32Array(x.memory.buffer, x.plonk_layers() >>> 0, x.plonk_layers_count() * 12), layers = [];
      for (let i = 0; i < t.length / 12; i++) {
        const o = i * 12, w = t[o + 3], h = t[o + 4];
        layers.push({ id: t[o], x: t[o + 1] | 0, y: t[o + 2] | 0, w, h, radius: t[o + 5] | 0, blur: t[o + 6] | 0, shadow: t[o + 7] | 0, ver: t[o + 8] + t[o + 10] * 4294967296, pix: new Uint32Array(x.memory.buffer, t[o + 9], w * h) });
      }
      gpuc.render(layers);
      ctx.drawImage(gpuc.canvas, 0, 0);
      P.c1 = (P.c1 || 0) + performance.now() - tc; P.comp += performance.now() - t2;
    } else {
    const p = x.plonk_wine_compose(W, H) >>> 0; P.c1 = (P.c1 || 0) + performance.now() - tc;
    { const d = new Uint32Array(x.memory.buffer, x.plonk_wine_dirty() >>> 0, 4); if (d[2]) ctx.putImageData(new ImageData(new Uint8ClampedArray(x.memory.buffer, p, W * H * 4), W, H), 0, 0, d[0], d[1], d[2], d[3]); }
    P.comp += performance.now() - t2;
    }
  }
  const stub = new TextDecoder().decode(new Uint8Array(x.memory.buffer, x.plonk_wine_stubbed_ptr() >>> 0, x.plonk_wine_stubbed_len()));
  const out = new TextDecoder().decode(new Uint8Array(x.memory.buffer, x.plonk_wine_stdout_ptr() >>> 0, x.plonk_wine_stdout_len()));
  const text = (stub ? "[unimplemented, answered 0: " + stub + "]\n" : "") + (st === 2 ? "running..." : st === 0 ? "running (waiting for input) - drag windows by the title bar, click the red X to close" : st === 1 ? "exited with code " + msg() : "error: " + msg());
  if (text !== lastLog) { lastLog = text; log(text); document.getElementById("out").textContent = out; }
}

const pos = (e) => {
  const r = canvas.getBoundingClientRect();
  return [Math.floor((e.clientX - r.left) * W / r.width), Math.floor((e.clientY - r.top) * H / r.height)];
};
let down = false;
canvas.addEventListener("pointerdown", (e) => { if (!x) return; down = true; canvas.setPointerCapture(e.pointerId); x.plonk_wine_mouse(0, ...pos(e)); step(); });
canvas.addEventListener("pointermove", (e) => { if (!x || !down) return; x.plonk_wine_mouse(1, ...pos(e)); step(); });
canvas.addEventListener("pointerup", (e) => { if (!x || !down) return; down = false; x.plonk_wine_mouse(2, ...pos(e)); step(); });
const vkOf = (e) => ({ Backspace: 8, Tab: 9, Enter: 13, Escape: 27, " ": 32, ArrowLeft: 37, ArrowUp: 38, ArrowRight: 39, ArrowDown: 40, Delete: 46, Home: 36, End: 35 }[e.key] ?? (e.key.length === 1 ? e.key.toUpperCase().charCodeAt(0) : e.keyCode));
const chOf = (e) => (e.ctrlKey || e.altKey || e.metaKey ? 0 : e.key.length === 1 ? e.key.charCodeAt(0) : { Backspace: 8, Enter: 13, Tab: 9 }[e.key] ?? 0);
window.addEventListener("keydown", (e) => { if (!x) return; e.preventDefault(); x.plonk_wine_key(0, vkOf(e), chOf(e)); step(); });
window.addEventListener("keyup", (e) => { if (!x) return; e.preventDefault(); x.plonk_wine_key(1, vkOf(e), 0); step(); });
setInterval(() => { if (x) step(); }, 16);
let customExe = null;
document.getElementById("file").onchange = (e) => { customExe = e.target.files[0] ?? null; if (customExe) log("Loaded " + customExe.name + " - press Run."); };
document.getElementById("app").onchange = () => { customExe = null; document.getElementById("file").value = ""; };
window.addEventListener("dragover", (e) => e.preventDefault());
window.addEventListener("drop", (e) => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) { customExe = f; log("Loaded " + f.name + " - press Run."); } });
document.getElementById("run").onclick = () => boot();
loadAppList();
// follow the available area: resize the guest screen, the compositor and the wallpaper
let fitTimer = 0;
async function fitScreen() {
  const r = stageEl.getBoundingClientRect();
  const w = Math.max(320, Math.floor(r.width)), h = Math.max(240, Math.floor(r.height));
  if (w === W && h === H) return;
  W = w; H = h; canvas.width = W; canvas.height = H;
  if (x) x.plonk_wine_set_screen(W, H);
  if (gpuc) { gpuc.gl?.getExtension("WEBGL_lose_context")?.loseContext(); gpuc = null; gpucP = null; ensureGpuc(); }
  try { const m = await import("./wallpaper.mjs"); setWall(await m.rasterize(W, H)); } catch (e) { console.info("wallpaper failed", e); }
  lastGen = -1; if (x) step();
}
new ResizeObserver(() => { clearTimeout(fitTimer); fitTimer = setTimeout(fitScreen, 120); }).observe(stageEl);
loadWallpaper();
</script>
</body>
</html>
