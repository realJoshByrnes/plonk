<!doctype html>
<meta charset="utf-8">
<title>Plonk · real Wine</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #14171c; color: #d8dde6; font: 13px/1.4 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  #bar { display: flex; gap: 6px; align-items: center; padding: 6px 10px; background: #1d2129; border-bottom: 1px solid #2c323d; flex-wrap: wrap; }
  #bar button, #bar label.btn { background: #2b3240; color: inherit; border: 1px solid #3a4354; border-radius: 6px; padding: 4px 10px; font: inherit; cursor: pointer; }
  #bar button:hover, #bar label.btn:hover { background: #364055; }
  #bar button:disabled { opacity: .45; cursor: default; }
  #status { margin-left: auto; opacity: .8; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #wrap { flex: 1; min-height: 0; overflow: hidden; }
  #stage { position: relative; line-height: 0; }
  #glov { position: absolute; display: none; pointer-events: none; }
  #screen { background: #3a6ea5; outline: none; image-rendering: pixelated; display: block; }
  #log { max-height: 110px; overflow: auto; margin: 0; padding: 4px 10px; background: #0f1115; color: #9aa4b5; font: 11px/1.35 ui-monospace, Consolas, monospace; white-space: pre-wrap; border-top: 1px solid #2c323d; }
  progress { width: 160px; }
  #taskbar { --tb: #202020f2; --tbl: #3a3a3a; --fg: #fff; --hv: #ffffff1a; --ac: #4cc2ff; display: flex; align-items: center; gap: 4px; height: 48px; padding: 0 8px; background: var(--tb); border-top: 1px solid var(--tbl); color: var(--fg); position: relative; user-select: none; }
  #taskbar.light { --tb: #f3f3f3f2; --tbl: #d6d6d6; --fg: #1b1b1b; --hv: #0000000d; --ac: #0067c0; }
  #taskbar button { background: none; border: 0; border-radius: 6px; color: inherit; font: 13px system-ui, "Segoe UI", sans-serif; height: 38px; padding: 0 10px; cursor: pointer; position: relative; }
  #taskbar button:hover { background: var(--hv); }
  #tasks { display: flex; gap: 4px; flex: 1; min-width: 0; overflow: hidden; }
  #tasks .task { max-width: 190px; min-width: 56px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
  #tasks .task::after { content: ""; position: absolute; left: 50%; bottom: 2px; width: 6px; height: 3px; margin-left: -3px; border-radius: 2px; background: #888; }
  #tasks .task.active { background: var(--hv); }
  #tasks .task.active::after { width: 18px; margin-left: -9px; background: var(--ac); }
  #tasks .task.min { opacity: .7; }
  #clock { font-size: 12px; text-align: right; line-height: 1.25; padding: 0 8px; white-space: pre; }
  #startmenu { position: absolute; left: 8px; bottom: 54px; min-width: 220px; padding: 8px; border-radius: 10px; background: var(--tb); border: 1px solid var(--tbl); box-shadow: 0 8px 28px #0008; display: none; flex-direction: column; }
  #startmenu.open { display: flex; }
  #startmenu button { text-align: left; height: 34px; }
</style>
<div id="bar">
  <strong>Plonk · real Wine</strong>
  <button data-cmd="notepad" disabled>Notepad</button>
  <button data-cmd="winemine" disabled>Minesweeper</button>
  <button data-cmd="regedit" disabled>Regedit</button>
  <button data-cmd="winfile.exe" disabled>File manager</button>
  <button data-cmd="winecfg" disabled>Wine config</button>
  <select id="guests" disabled><option value="">Test programs…</option></select>
  <label class="btn">Run your own .exe…<input id="upload" type="file" multiple hidden></label>
  <span id="status"><progress id="prog" max="1" value="0"></progress> <span id="stxt">loading…</span></span>
</div>
<div id="wrap"><div id="stage"><canvas id="screen" width="1024" height="768" tabindex="0"></canvas><canvas id="glov"></canvas></div></div>
<div id="taskbar"><button id="start" title="Start"><svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4cc2ff" d="M0 2.5 7.5 1.5v6.8H0zM8.6 1.4 18 0v8.3H8.6zM0 9.7h7.5v6.8L0 15.5zM8.6 9.7H18V18l-9.4-1.3z"/></svg></button><div id="tasks"></div><div id="clock"></div><div id="startmenu"></div></div>
<pre id="log"></pre>
<script type="module">
// The real-Wine path: unmodified Wine (wine, wineserver, ntdll.so, win32u.so, PE DLLs) on the Linux personality of the
// interpreter (crates/host/src/linux.rs), drawing through wineplonk.drv. See crates/host/src/wasm_linux.rs for the exports.
const $ = (id) => document.getElementById(id);
// ---- taskbar (HTML under the desktop canvas): a button per application window, Start menu, clock ----
const themeQ = new URLSearchParams(location.search).get("theme");
const isDark = themeQ === "dark" || themeQ === "light" ? themeQ === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
$("taskbar").classList.toggle("light", !isDark);
let tasksKey = "";
function updateTasks() {
  if (!x) return;
  x.plonk_lx_tasks();
  const s = msg();
  if (s === tasksKey) return;
  tasksKey = s;
  $("tasks").replaceChildren(...s.split("\n").filter(Boolean).map((line) => {
    const [h, st, ...t] = line.split("\t"), b = document.createElement("button"), state = +st;
    b.textContent = t.join(" "); b.title = b.textContent;
    b.className = "task" + (state & 4 ? " active" : "") + (state & 2 ? " min" : "");
    b.onclick = () => { x.plonk_lx_activate(+h, state & 4 ? 2 : 1); kick(); canvas.focus(); };
    return b;
  }));
}
const tick = () => { const d = new Date(); $("clock").textContent = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) + "\n" + d.toLocaleDateString(); };
tick(); setInterval(tick, 10000);
$("start").onclick = (e) => {
  e.stopPropagation();
  const m = $("startmenu");
  if (!m.classList.toggle("open")) return;
  m.replaceChildren(...[...document.querySelectorAll("#bar button[data-cmd]")].map((src) => {
    const b = document.createElement("button"); b.textContent = src.textContent; b.onclick = () => { m.classList.remove("open"); src.click(); }; return b;
  }));
};
document.addEventListener("pointerdown", (e) => { if (!e.target.closest("#startmenu, #start")) $("startmenu").classList.remove("open"); });
const canvas = $("screen");
// The desktop is composed on the GPU (web/compositor.mjs) on this one canvas; without WebGL2 (or with ?cpu) the kernel composes
// it on the CPU and it is drawn with putImageData.
let comp = null, ctx = null;
const wantGpu = !new URLSearchParams(location.search).has("cpu");
if (wantGpu) { try { comp = (await import("./compositor.mjs")).createCompositor(canvas); } catch (e) { console.warn(e); } }
if (!comp) ctx = canvas.getContext("2d");
if (comp) { const q = new URLSearchParams(location.search).get("theme"); if (q === "dark" || q === "light") comp.setDark(q === "dark"); }
const inCanvas = new URLSearchParams(location.search).has("incanvas"); // default: 3D on its own canvas over the desktop (faster); ?incanvas draws it into the desktop canvas
let glFrame = null, glDirty = false; // the latest 3D frame, drawn by the compositor
let W = canvas.width, H = canvas.height;
const logEl = $("log");
const log = (s) => { logEl.textContent += s; if (logEl.textContent.length > 20000) logEl.textContent = logEl.textContent.slice(-15000); logEl.scrollTop = logEl.scrollHeight; };
const status = (s) => { $("stxt").textContent = s; };

async function fetchBytes(url, label, share, base) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${url}: ${r.status}`);
  const total = +(r.headers.get("x-size") || r.headers.get("content-length") || 0);
  const reader = r.body.getReader(), parts = [];
  let got = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    parts.push(value); got += value.length;
    if (total) $("prog").value = base + share * Math.min(1, got / total);
    status(`${label} ${(got / 1048576).toFixed(0)} MB`);
  }
  const out = new Uint8Array(got);
  let o = 0;
  for (const p of parts) { out.set(p, o); o += p.length; }
  return out;
}

let x; // wasm exports
const put = (bytes) => { const p = x.plonk_alloc(bytes.length); new Uint8Array(x.memory.buffer, p, bytes.length).set(bytes); return p; };
const msg = () => new TextDecoder().decode(new Uint8Array(x.memory.buffer, x.plonk_lx_msg(), x.plonk_lx_msg_len()));
const enc = new TextEncoder();
function addFile(path, bytes) { const n = enc.encode(path); x.plonk_lx_add_file(put(n), n.length, put(bytes), bytes.length); }
// Files of the Wine install the guest is waiting for: fetch each once and hand it to the kernel (the waiting call then goes on).
const fetching = new Set();
async function fetchFile(path) {
  if (fetching.has(path)) return;
  fetching.add(path);
  // The guest waits until the file is there, so a failed fetch (server restarting, network blip) is retried, not given up on:
  // an empty file would look like a broken DLL to Wine for the rest of the session.
  for (let wait = 250; ; wait = Math.min(wait * 2, 5000)) {
    try {
      const r = await fetch("/real/f" + path.split("/").map(encodeURIComponent).join("/"));
      if (r.status === 404) { log(`${path} is not on the server\n`); addFile(path, new Uint8Array(0)); break; }
      if (!r.ok) throw new Error(r.status);
      const bytes = new Uint8Array(await r.arrayBuffer());
      addFile(path, bytes);
      break;
    } catch (e) { status(`retrying ${path.split("/").pop()}…`); await new Promise((res) => setTimeout(res, wait)); }
  }
  kick();
}
// Hot guest code is translated to wasm by the kernel; the browser compiles each batch off the main thread and the kernel
// is told where the functions landed in the table. ?nojit turns it off.
const jitOn = !new URLSearchParams(location.search).has("nojit");
let jitBusy = false;
function jitPump() {
  if (jitBusy) return;
  const n = x.plonk_lx_jit_take();
  if (!n) return;
  jitBusy = true;
  const bytes = new Uint8Array(x.memory.buffer, x.plonk_lx_jit_ptr(), n).slice(), id = x.plonk_lx_jit_id(), count = x.plonk_lx_jit_count();
  WebAssembly.instantiate(bytes, { e: { m: x.memory } }).then(({ instance }) => {
    const table = x.__indirect_function_table, first = table.length;
    table.grow(count);
    for (let i = 0; i < count; i++) table.set(first + i, instance.exports[i]);
    x.plonk_lx_jit_installed(id, first);
  }).catch((e) => { log("jit module failed: " + e.message + "\n"); x.plonk_lx_jit_installed(id, 0); }).finally(() => { jitBusy = false; });
}
function fetchWanted() { if (x.plonk_lx_wanted()) for (const p of msg().split("\n")) fetchFile(p); }
function spawn(...args) {
  const c = enc.encode(["/usr/local/bin/wine", ...args].join("\n")), p = put(c);
  const pid = x.plonk_lx_spawn(p, c.length);
  if (pid < 0) log("spawn failed: " + msg() + "\n"); else log(`started ${args.join(" ")} (pid ${pid})\n`);
  kick();
  return pid;
}

// ---- main loop: run the guest in ~10 ms slices against the real clock; repaint when the driver reported changes ----
let steps = 400000, last = performance.now(), lastFrame = -1, dead = false, timer = 0, idleSince = 0;
const again = new MessageChannel();
again.port1.onmessage = () => { if (timer === -1) pump(); };
function kick() { if (dead || timer === -1) return; clearTimeout(timer); timer = -1; again.port2.postMessage(0); }
function pump() {
  timer = 0;
  if (dead) return;
  const t0 = performance.now();
  let r = 0, presents = x.plonk_lx_gl_presents();
  // several slices per turn while the guest is busy, but never more than ~14 ms so input and painting stay live
  do {
    const now = performance.now();
    r = x.plonk_lx_run(steps, Math.min(250000, Math.round((now - last) * 1000)));
    last = now;
    const took = performance.now() - now;
    if (r === 0) steps = Math.max(50000, Math.min(4000000, Math.round(steps * (took < 3 ? 1.5 : took > 8 ? 0.6 : 1))));
    // a 3D program returns once per frame: replay that frame right away and keep going, so the frame rate is not tied to timers
    const pr = x.plonk_lx_gl_presents();
    if (pr !== presents) { presents = pr; pumpGL(); }
  } while (r === 0 && performance.now() - t0 < 12);
  fetchWanted();
  if (jitOn) jitPump();
  x.plonk_lx_take_stdout();
  const out = msg();
  if (out) log(out);
  if (r < 0) { dead = true; log("kernel error: " + msg() + "\n"); status("stopped"); return; }
  const f = x.plonk_lx_frame();
  if (f !== lastFrame) { lastFrame = f; paint(); updateTasks(); }
  pumpGL();
  // everything waiting: poll timers/input at a relaxed rate; busy: go again at once (a message, since timers are clamped to 4 ms)
  if (r === 1) timer = setTimeout(pump, 8); else { timer = -1; again.port2.postMessage(0); }
}
// ---- 3D: the kernel emits a canonical GL command stream (docs/GL_PROTOCOL.md); the backend replays it on WebGPU/WebGL2 and
// the finished frame is shown on an overlay canvas placed over the GL window's client area ----
let glb = null, glInit = null;
function ensureGL() {
  if (glInit) return;
  const q = new URLSearchParams(location.search), direct = !q.has("nodirect");
  glInit = import("./gl_backend.mjs").then((m) => m.createGLBackend({ prefer: q.get("gl") || "webgpu", direct })).then((b) => {
    const ov = $("glov");
    if (comp && inCanvas) { // the frame is drawn into the desktop canvas by the compositor
      b.onFrame = (w, h, bmp) => { glFrame?.close?.(); glFrame = bmp; glDirty = true; };
      b.onPresent = (w, h, rgba) => { glFrame = { w, h, rgba: rgba.slice() }; glDirty = true; };
    } else if (direct) { // the finished frame goes straight to the overlay canvas (no read-back)
      const ovctx = ov.getContext("bitmaprenderer");
      b.onFrame = (w, h, bmp) => { if (ov.width !== w || ov.height !== h) { ov.width = w; ov.height = h; } ovctx.transferFromImageBitmap(bmp); };
      b.onPresent = () => {};
    } else { // ?nodirect: read the pixels back and draw them (slower; for checking the backend)
      const ovctx = ov.getContext("2d");
      b.onPresent = (w, h, rgba) => { if (ov.width !== w || ov.height !== h) { ov.width = w; ov.height = h; } ovctx.putImageData(new ImageData(new Uint8ClampedArray(rgba.buffer, rgba.byteOffset, w * h * 4).slice(), w, h), 0, 0); window.__glNonZero = rgba.some((v) => v !== 0); };
    }
    glb = b;
    log("3D backend: " + b.kind + String.fromCharCode(10));
    kick();
  }).catch((e) => { log("3D backend failed: " + e + String.fromCharCode(10)); glInit = null; x.plonk_lx_gl_clear(); });
}
const glOn = () => { const r = new Uint32Array(x.memory.buffer, x.plonk_lx_gl_rect() >>> 0, 5); return !!glb && r[4] === 1 && r[2] > 0; };
function syncOverlay() {
  if (comp && inCanvas) { // only the 3D frame changed: draw just that
    if (glDirty) { glDirty = false; if (glFrame && glOn()) { const r = new Int32Array(x.memory.buffer, x.plonk_lx_gl_rect() >>> 0, 4); comp.over({ source: glFrame, x: r[0], y: r[1], w: r[2], h: r[3] }, W, H); } }
    return;
  }
  const ov = $("glov"), r = new Uint32Array(x.memory.buffer, x.plonk_lx_gl_rect() >>> 0, 5), k = canvas.getBoundingClientRect().width / W;
  const on = !!glb && r[4] === 1 && r[2] > 0;
  ov.style.display = on ? "block" : "none";
  if (on) { ov.style.left = r[0] * k + "px"; ov.style.top = r[1] * k + "px"; ov.style.width = r[2] * k + "px"; ov.style.height = r[3] * k + "px"; }
}
function pumpGL() {
  const n = x.plonk_lx_gl_len();
  if (n) {
    if (!glb) { ensureGL(); return; } // commands stay queued in the kernel until the backend is ready
    const cmds = new Uint32Array(x.memory.buffer, x.plonk_lx_gl_ptr() >>> 0, n).slice();
    x.plonk_lx_gl_clear();
    glb.execute(cmds);
  }
  syncOverlay();
}
function paint() {
  if (comp) {
    const ptr = x.plonk_lx_scene() >>> 0, n = new Uint32Array(x.memory.buffer, ptr, 1)[0];
    let over = null;
    if (inCanvas && glFrame && glOn()) { const r = new Int32Array(x.memory.buffer, x.plonk_lx_gl_rect() >>> 0, 4); over = { source: glFrame, x: r[0], y: r[1], w: r[2], h: r[3] }; }
    comp.frame(x.memory.buffer, new Uint32Array(x.memory.buffer, ptr, 1 + n * 17), W, H, over, (h) => { x.plonk_lx_title(h); return msg(); });
    x.plonk_lx_scene_done();
    glDirty = false;
    return;
  }
  const p = x.plonk_lx_compose();
  ctx.putImageData(new ImageData(new Uint8ClampedArray(x.memory.buffer, p, W * H * 4), W, H), 0, 0);
  const k = x.plonk_lx_cursor();
  canvas.style.cursor = ["default", "text", "wait", "crosshair", "nwse-resize", "nesw-resize", "ew-resize", "ns-resize", "move", "not-allowed", "pointer"][k] ?? (k < 0 ? "none" : "default");
}
let mipsAt = 0, mipsT = performance.now();
setInterval(() => {
  if (!x || dead) return;
  const m = x.plonk_lx_mips_total(), t = performance.now();
  status(`${Math.round((m - mipsAt) / ((t - mipsT) / 1000))} MIPS · ${(x.memory.buffer.byteLength / 1048576) | 0} MB`);
  mipsAt = m; mipsT = t;
}, 1000);

// ---- the desktop is as large as the page area, one guest pixel per device pixel (so text is never rescaled) ----
let fitTimer = 0;
function fitScreen() {
  const r = $("wrap").getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(640, Math.floor(r.width * dpr)), h = Math.max(480, Math.floor(r.height * dpr));
  canvas.style.width = w / dpr + "px"; canvas.style.height = h / dpr + "px";
  if (w === W && h === H) return;
  W = w; H = h; canvas.width = W; canvas.height = H;
  if (x) { x.plonk_lx_set_screen(W, H); lastFrame = -1; paint(); kick(); }
}
new ResizeObserver(() => { clearTimeout(fitTimer); fitTimer = setTimeout(fitScreen, 120); }).observe($("wrap"));
window.matchMedia("(resolution: 1dppx)").addEventListener?.("change", fitScreen); // browser zoom / moving to another monitor

// ---- input ----
const pos = (e) => { const r = canvas.getBoundingClientRect(); return [Math.round((e.clientX - r.left) * W / r.width), Math.round((e.clientY - r.top) * H / r.height)]; };
const btn = (e) => (e.button === 2 ? 1 : e.button === 1 ? 2 : 0);
canvas.addEventListener("pointerdown", (e) => { canvas.focus(); canvas.setPointerCapture(e.pointerId); const [px, py] = pos(e); x.plonk_lx_mouse(1, px, py, 0); x.plonk_lx_mouse(0, px, py, btn(e)); kick(); e.preventDefault(); });
canvas.addEventListener("pointerup", (e) => { const [px, py] = pos(e); x.plonk_lx_mouse(2, px, py, btn(e)); kick(); e.preventDefault(); });
let moveQueued = null;
canvas.addEventListener("pointermove", (e) => { // at most one move per pump turn
  const had = moveQueued; moveQueued = pos(e);
  if (!had) queueMicrotask(() => { const [px, py] = moveQueued; moveQueued = null; x.plonk_lx_mouse(1, px, py, 0); if (comp && comp.setPointer(px, py)) paint(); });
});
canvas.addEventListener("pointerleave", () => { if (comp && comp.setPointer(null)) paint(); });
canvas.addEventListener("wheel", (e) => { const [px, py] = pos(e); x.plonk_lx_wheel(px, py, e.deltaY < 0 ? 120 : -120); e.preventDefault(); }, { passive: false });
canvas.addEventListener("contextmenu", (e) => e.preventDefault());
// KeyboardEvent.keyCode is the Windows virtual-key code for nearly every key; scan codes come from this table (set 1).
const SCAN = { Escape: 1, Digit1: 2, Digit2: 3, Digit3: 4, Digit4: 5, Digit5: 6, Digit6: 7, Digit7: 8, Digit8: 9, Digit9: 10, Digit0: 11, Minus: 12, Equal: 13, Backspace: 14, Tab: 15,
  KeyQ: 16, KeyW: 17, KeyE: 18, KeyR: 19, KeyT: 20, KeyY: 21, KeyU: 22, KeyI: 23, KeyO: 24, KeyP: 25, BracketLeft: 26, BracketRight: 27, Enter: 28, ControlLeft: 29,
  KeyA: 30, KeyS: 31, KeyD: 32, KeyF: 33, KeyG: 34, KeyH: 35, KeyJ: 36, KeyK: 37, KeyL: 38, Semicolon: 39, Quote: 40, Backquote: 41, ShiftLeft: 42, Backslash: 43,
  KeyZ: 44, KeyX: 45, KeyC: 46, KeyV: 47, KeyB: 48, KeyN: 49, KeyM: 50, Comma: 51, Period: 52, Slash: 53, ShiftRight: 54, AltLeft: 56, Space: 57, CapsLock: 58,
  F1: 59, F2: 60, F3: 61, F4: 62, F5: 63, F6: 64, F7: 65, F8: 66, F9: 67, F10: 68, F11: 87, F12: 88,
  ControlRight: 0x11d, AltRight: 0x138, Home: 0x147, ArrowUp: 0x148, PageUp: 0x149, ArrowLeft: 0x14b, ArrowRight: 0x14d, End: 0x14f, ArrowDown: 0x150, PageDown: 0x151, Insert: 0x152, Delete: 0x153 };
const key = (down) => (e) => { if (!x) return; x.plonk_lx_key(down, e.keyCode, SCAN[e.code] ?? 0); kick(); e.preventDefault(); };
canvas.addEventListener("keydown", key(1));
canvas.addEventListener("keyup", key(0));

// ---- boot ----
try {
  status("loading wasm…");
  const tLoad = performance.now();
  // everything is requested at once; the results are used in order below
  const hold = (pr) => { pr.catch(() => {}); return pr; };
  const dl = { index: hold(fetchBytes("/real/index", "Wine index", 0.02, 0)), prefix: hold(fetchBytes("/real/prefix.tar", "prefix", 0.03, 0.02)),
    boot: hold(fetchBytes("/real/boot.tar", "Wine", 0.45, 0.05)), snap: hold(fetchBytes("/real/snapshot.bin", "session", 0.5, 0.5)),
    wine: hold(fetch("/real/f/usr/local/bin/wine").then((r) => r.arrayBuffer())) };
  const { instance } = await WebAssembly.instantiateStreaming(fetch("/target/wasm32-unknown-unknown/release/plonk_host.wasm"), {});
  x = instance.exports;
  if (!new URLSearchParams(location.search).has("nojit")) x.plonk_lx_jit_enable(1);
  window.__lx = { x, msg }; // for debugging from the console / headless checks
  // The Wine install is only declared (names and sizes); a file's contents are fetched when the guest first opens it
  // (fetchWanted). The files the snapshot's processes already have open come in one archive up front.
  const index = await dl.index;
  x.plonk_lx_add_index(put(index), index.length);
  const prefixTar = await dl.prefix;
  x.plonk_lx_add_tar(put(prefixTar), prefixTar.length);
  try { const boot = await dl.boot; x.plonk_lx_provide_tar(put(boot), boot.length); } catch (e) { log("no boot archive (" + e.message + ")\n"); }
  addFile("/usr/local/bin/wine", new Uint8Array(await dl.wine)); // what every program is started with
  fitScreen();
  // A snapshot of a booted, idle Wine session (wineserver, services, explorer and the invisible keeper process) skips
  // Wine's own start-up. Without one (or with a stale one) the session is booted here, which takes much longer.
  let warm = false;
  try {
    const snap = await dl.snap;
    warm = x.plonk_lx_restore(put(snap), snap.length) === 0;
    if (!warm) log("snapshot not used: " + msg() + "\n");
  } catch (e) { log("no snapshot (" + e.message + "): cold start\n"); }
  x.plonk_lx_set_screen(W, H); // the snapshot was taken at 1024x768: tell Wine the real size
  if (!warm) {
    addFile("/home/user/keeper.exe", new Uint8Array(await (await fetch("/tests/guests/keeper.exe")).arrayBuffer()));
    spawn("/home/user/keeper.exe"); // keeps the Wine session alive between programs
  }
  // On a scaled display (Windows at 125%, 150%, ...) a guest pixel is a device pixel, so tell Wine the matching DPI: programs
  // read it from the registry when they start, and then lay themselves out at normal physical size, still unscaled.
  const dpi = Math.round(96 * (window.devicePixelRatio || 1) / 24) * 24;
  if (dpi !== 96 && !new URLSearchParams(location.search).has("nodpi")) {
    status(`setting ${dpi} DPI…`);
    const pid = spawn("reg", "add", "HKCU\\Control Panel\\Desktop", "/v", "LogPixels", "/t", "REG_DWORD", "/d", String(dpi), "/f");
    const t0 = performance.now();
    while (pid > 0 && x.plonk_lx_alive(pid) && performance.now() - t0 < 30000) await new Promise((res) => setTimeout(res, 50));
  }
  { // Win11-style colours and metrics from wine/fonts/theme-{dark,light}.reg, chosen by ?theme= or prefers-color-scheme
    const q = new URLSearchParams(location.search).get("theme");
    const theme = q === "dark" || q === "light" ? q : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    if (q !== "none") {
      status(`applying ${theme} theme…`);
      addFile("/home/user/theme.reg", new Uint8Array(await (await fetch(`/wine/fonts/theme-${theme}.reg`)).arrayBuffer()));
      const pid = spawn("regedit", "/S", "Z:\\home\\user\\theme.reg");
      const t0 = performance.now();
      while (pid > 0 && x.plonk_lx_alive(pid) && performance.now() - t0 < 30000) await new Promise((res) => setTimeout(res, 50));
    }
  }
  $("prog").remove();
  status("ready");
  log(`ready in ${((performance.now() - tLoad) / 1000).toFixed(1)} s
`);
  for (const b of document.querySelectorAll("#bar button")) { b.disabled = false; b.onclick = async () => { const c = b.dataset.cmd; if (c.endsWith(".exe")) { addFile("/home/user/" + c, new Uint8Array(await (await fetch("/tests/guests/" + c)).arrayBuffer())); spawn("/home/user/" + c); } else spawn(c); canvas.focus(); }; }
  const man = await (await fetch("/manifest.json")).json();
  const sel = $("guests");
  for (const a of man.apps) sel.add(new Option(a, a));
  sel.disabled = false;
  sel.onchange = async () => {
    const a = sel.value; sel.value = "";
    if (!a) return;
    addFile("/home/user/" + a, new Uint8Array(await (await fetch("/tests/guests/" + a)).arrayBuffer()));
    spawn("/home/user/" + a); canvas.focus();
  };
  $("upload").onchange = async (e) => { // all chosen files land in one folder; the first .exe is started there
    const files = [...e.target.files];
    for (const f of files) addFile("/home/user/app/" + f.name, new Uint8Array(await f.arrayBuffer()));
    const exe = files.find((f) => /\.exe$/i.test(f.name));
    if (exe) { spawn("/home/user/app/" + exe.name); canvas.focus(); } else log("no .exe among the chosen files\n");
    e.target.value = "";
  };
  const want = new URLSearchParams(location.search).get("run");
  if (want) { // ?run=notepad  or  ?run=/home/user/gl_cube.exe (test programs are fetched on demand)
    const args = want.split(" ");
    for (const g of args) if (g.startsWith("/home/user/") && man.apps.includes(g.slice(11))) addFile(g, new Uint8Array(await (await fetch("/tests/guests/" + g.slice(11))).arrayBuffer()));
    spawn(...args);
  }
} catch (err) { status("failed"); log(String(err.stack || err) + "\n"); }
</script>
